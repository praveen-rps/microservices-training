<html xmlns:th="http://www.thymeleaf.org">
<body>
<h2>Welcome to Wipro Flight</h2>
<table border="1">
	<tr>
		<th>Flight id</th>
		<th>Provider</th>
		<th>Source</th>
		<th>Destination</th>
	</tr>
	<tr th:each="flight:${flights}" >
		<td th:text="${flight.flightId}" />
		<td th:text="${flight.provider}" />
		<td th:text="${flight.source}" />
		<td th:text="${flight.destination}" />
	</tr>
</table>
<a href="/">Home</a>
</body>
</html>
